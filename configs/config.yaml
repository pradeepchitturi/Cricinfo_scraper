# ============================================================================
# Cricket Data Pipeline - Medallion Architecture Configuration (Enhanced)
# ============================================================================

# Schema Configuration
schemas:
  raw: raw
  bronze: bronze
  silver: silver
  gold: gold

# ============================================================================
# Bronze Layer Configuration
# ============================================================================
bronze:
  source_schema: raw
  target_schema: bronze

  source_tables:
    - name: match_metadata
      primary_key: id
      business_key: matchid
      check_duplicates: true
      required_columns: [matchid, venue, series, season]

    - name: match_events
      primary_key: id
      business_key: [matchid, ball, innings, commentary]
      check_duplicates: true
      required_columns: [matchid, ball, innings, batsman, bowler]

    - name: match_players
      primary_key: id
      business_key: [matchid, innings, player_name]
      check_duplicates: true
      required_columns: [matchid, team, player_name]

  settings:
    batch_size: 1000
    add_audit_columns: true
    remove_nulls: true
    report_data_quality: true
    validate_innings: true

# ============================================================================
# Silver Layer Configuration
# ============================================================================
silver:
  source_schema: bronze
  target_schema: silver

  transformations:
    match_metadata:
      - type: clean
        columns:
          venue: [trim, title_case]
          series: [trim]
          toss: [trim]
          player_of_the_match: [trim]

      - type: validate
        rules:
          season: not_null
          matchid: not_null
          venue: not_null

    match_events:
      - type: clean
        columns:
          bowler: [trim]
          batsman: [trim]
          commentary: [trim]
          innings: [trim]

      - type: convert_score
        column: score
        mappings:
          "no runs": 0
          "no run": 0
          "1 run": 1
          "2 runs": 2
          "3 runs": 3
          "FOUR": 4
          "FOUR runs": 4
          "SIX": 6
          "SIX runs": 6
          "1 wide": 1
          "2 wides": 2
          "3 wides": 3
          "4 wides": 4
          "5 wides": 5
          "1 no ball": 1
          "2 no balls": 2
          "3 no balls": 3
          "4 no balls": 4
          "1 leg bye": 1
          "2 leg byes": 2
          "3 leg byes": 3
          "4 leg byes": 4
          "1 bye": 1
          "2 byes": 2
          "3 byes": 3
          "4 byes": 4

      - type: extract_dismissal
        score_column: score
        commentary_column: commentary

      - type: validate
        rules:
          matchid: not_null
          ball: not_null
          innings: not_null

      # NEW: Enrich player names with full names from match_players
      - type: enrich_player_names
        columns:
          - batsman
          - bowler
          - fielder_name

      # NEW: Enrich team names with full names from match_players
      - type: enrich_team_names
        columns:
          - innings

    match_players:
      - type: clean
        columns:
          player_name: [trim]
          team: [trim, title_case]

      - type: validate
        rules:
          matchid: not_null
          player_name: not_null
          team: not_null

# ============================================================================
# Gold Layer Configuration (Enhanced)
# ============================================================================
gold:
  source_schema: silver
  target_schema: gold

  aggregations:
    # 1. Enhanced Match Summary (with scores and winner)
    match_summary:
      type: custom
      description: "Match summary with innings scores and winner determination"

    # 2. Enhanced Series Summary (with series_id)
    series_summary:
      type: custom
      description: "Series summary with Cricinfo series ID"

    # 3. Venue Statistics (standard)
    venue_statistics:
      source: match_metadata
      group_by:
        - venue
        - season
      metrics:
        - name: total_matches
          type: count
          column: matchid

    # 4. Match Ball Statistics (with wickets)
    match_ball_statistics:
      type: custom
      description: "Match ball statistics per innings with wickets"

    # 5. Match Batsman Statistics (with run distribution)
    match_batsman_statistics:
      type: custom
      description: "Per-match batting statistics with run distribution (1s, 2s, 3s, 4s, 6s)"

    # 6. Match Bowler Statistics (with wickets, extras, run distribution)
    match_bowler_statistics:
      type: custom
      description: "Per-match bowling statistics with wickets, extras, and run distribution"

    # 7. Batsman Statistics (Career - NEW)
    batsman_statistics:
      type: custom
      description: "Career batting statistics with 50s, 100s, not outs, and run distribution"

    # 8. Bowler Statistics (Career - NEW)
    bowler_statistics:
      type: custom
      description: "Career bowling statistics with wickets, extras, and run distribution"

    # 9. Player Team History (SCD Type 2)
    player_team_history:
      type: scd_type2
      source: match_players
      dimension_keys:
        - player_name
        - team
        - season
      description: "Track player-team associations over time with SCD Type 2"